<!doctype html>
<html lang="en">
<head>
  <title>UnstoppableMango</title>
  <meta http-equiv='Content-Type' content='text/html; charset=utf-8'>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="favicon.ico" />
  <script>
    // Applies the stored palette before anything renders. The bundle sets the
    // same class later, but it loads too late to prevent a flash of the default
    // theme. The key and the prefix are duplicated from src/App/Pulp/Theme.fs
    // because this has to run without it.
    try {
      var p = localStorage.getItem('pulp-theme');
      if (p && /^[a-z]+$/.test(p)) document.documentElement.classList.add('pulp-theme-' + p);
    } catch (e) {
      // Site data blocked. The default palette on :root still renders.
    }
  </script>
</head>
<body>
    <div id="sutil-app"></div>
    <script src="bundle.js"></script>
</body>
</html>
