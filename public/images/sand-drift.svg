<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="none">
  <!-- Wind-stretched sand streaks: turbulence squashed on the y axis so the noise
       reads as horizontal drift rather than static. -->
  <defs>
    <filter id="drift" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.06" numOctaves="4" seed="7" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55" intercept="-0.1" />
      </feComponentTransfer>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d9b8" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#c9b48d" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6b6047" stop-opacity="0.05" />
    </linearGradient>
    <mask id="streaks">
      <rect width="1200" height="800" fill="#fff" filter="url(#drift)" />
    </mask>
  </defs>
  <rect width="1200" height="800" fill="url(#fade)" mask="url(#streaks)" />
</svg>
